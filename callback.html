<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; connect-src http://127.0.0.1:8765; script-src 'sha256-YnG2mYpGdO5h5XsmhYZogBfAu/iJLoVc3gDqhAJ0R3o='; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'">
  <title>Volver a Mi Finanzas</title>
  <style>body{font:16px system-ui,sans-serif;max-width:42rem;margin:12vh auto;padding:0 1.2rem;color:#17202a}button{font:inherit;padding:.7rem 1rem}code{overflow-wrap:anywhere}</style>
</head>
<body>
  <h1>Autorización bancaria</h1>
  <p id="message">Verificando el retorno de Enable Banking…</p>
  <button id="continue" hidden>Entregar retorno a Mi Finanzas en este equipo</button>
  <script>
  (() => {
    // Never send the code to a public host. POST directly to the loopback app.
    const params = new URLSearchParams(location.search);
    const payload = {
      code: params.get('code'), state: params.get('state'),
      error: params.get('error'), error_description: params.get('error_description')
    };
    history.replaceState(null, '', location.pathname);
    const msg = document.getElementById('message');
    const button = document.getElementById('continue');
    if (!payload.state || (!payload.code && !payload.error)) {
      msg.textContent = location.protocol === 'file:'
        ? 'Esta es una copia local. Sube callback.html al repositorio mi-finanzas-legal y abre la dirección HTTPS de GitHub Pages. No conectes aún una cuenta bancaria.'
        : 'Faltan parámetros de retorno. Esta página solo recibe datos al volver aquí desde Enable Banking. No conectes aún una cuenta bancaria.';
      return;
    }
    msg.textContent = 'El retorno está listo. Pulsa para entregarlo de forma directa a Mi Finanzas en este equipo.';
    button.hidden = false;
    button.addEventListener('click', async () => {
      button.disabled = true;
      try {
        const response = await fetch('http://127.0.0.1:8765/enable-banking/callback', {
          method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(payload),
          mode: 'cors', credentials: 'omit', cache: 'no-store', redirect: 'error'
        });
        const result = await response.json();
        msg.textContent = response.ok ? 'Conexión recibida y guardada localmente. Ya puedes cerrar esta página.'
          : 'Mi Finanzas rechazó el retorno: ' + (result.error || 'error de verificación') + '. Vuelve a iniciar el proceso.';
      } catch (_) {
        msg.textContent = 'No se pudo contactar con Mi Finanzas. Comprueba que la aplicación local está abierta y vuelve a pulsar.';
        button.disabled = false;
      }
    });
  })();
  </script>
</body>
</html>
